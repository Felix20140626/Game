<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Web v26.1 - 联机版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #87CEEB;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
        }

        #player-list {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            min-width: 200px;
            z-index: 100;
        }

        #chat-container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 400px;
            z-index: 100;
        }

        #chat-messages {
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        #chat-input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: rgba(255,255,255,0.9);
            font-family: inherit;
        }

        .hotbar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 100;
        }

        .hotbar-slot {
            width: 50px;
            height: 50px;
            border: 3px solid #555;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .hotbar-slot.active {
            border-color: white;
            transform: scale(1.1);
        }

        .hotbar-slot img {
            width: 40px;
            height: 40px;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            z-index: 100;
            pointer-events: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }

        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            height: 2px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }

        #version-info {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .message {
            margin: 5px 0;
            padding: 3px 0;
        }

        .system-message {
            color: #FFFF55;
        }

        .player-message {
            color: white;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container"></div>
        
        <div id="ui-overlay">
            <div>Minecraft Web Edition</div>
            <div id="version-info">Version 26.1</div>
            <div id="coords">Position: 0, 0, 0</div>
            <div id="fps">FPS: 0</div>
        </div>

        <div id="player-list">
            <h3>在线玩家 (<span id="player-count">0</span>)</h3>
            <ul id="players"></ul>
        </div>

        <div id="chat-container">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="按 Enter 发送消息...">
        </div>

        <div class="hotbar" id="hotbar">
            <div class="hotbar-slot active" data-block="1"><div style="width:30px;height:30px;background:#5C9E47;"></div></div>
            <div class="hotbar-slot" data-block="2"><div style="width:30px;height:30px;background:#8B4513;"></div></div>
            <div class="hotbar-slot" data-block="3"><div style="width:30px;height:30px;background:#228B22;"></div></div>
            <div class="hotbar-slot" data-block="4"><div style="width:30px;height:30px;background:#808080;"></div></div>
            <div class="hotbar-slot" data-block="5"><div style="width:30px;height:30px;background:#FFD700;"></div></div>
        </div>

        <div id="crosshair"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
