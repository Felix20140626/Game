<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进化点击游戏 - Evolution Clicker</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <div id="app">
        <header class="game-header">
            <h1>🧬 进化点击游戏</h1>
            <div class="resource-bar">
                <span class="resource">DNA: <span id="dna-count">0</span></span>
                <span class="resource">能量: <span id="energy-count">0</span></span>
                <span class="resource">世代: <span id="generation-count">1</span></span>
            </div>
        </header>

        <main class="game-main">
            <section class="click-section">
                <div class="organism-display">
                    <h2 id="organism-name">原始单细胞</h2>
                    <div class="organism-sprite" id="organism-sprite">🦠</div>
                    <button id="click-btn" class="evolve-btn">吸收能量!</button>
                </div>
            </section>

            <section class="evolution-section">
                <h2>进化路径</h2>
                <div id="evolution-tree" class="evolution-tree"></div>
            </section>

            <section class="upgrades-section">
                <h2>升级与变异</h2>
                <div id="upgrades-list" class="upgrades-list"></div>
            </section>

            <section class="log-section">
                <h2>进化日志</h2>
                <div id="game-log" class="game-log"></div>
            </section>
        </main>

        <footer class="game-footer">
            <p>通过点击收集DNA，不断进化成为更高级的生命形式!</p>
        </footer>
    </div>

    <script src="src/utils.js"></script>
    <script src="src/constants.js"></script>
    <script src="src/gameState.js"></script>
    <script src="src/evolutionTree.js"></script>
    <script src="src/upgrades.js"></script>
    <script src="src/renderer.js"></script>
    <script src="src/eventHandlers.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
