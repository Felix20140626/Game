<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进化点击游戏 - Evolution Clicker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #e94560;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .game-area {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 1.5em;
            color: #e94560;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
        }

        .resource-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .resource-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #e94560;
        }

        .resource-name {
            font-size: 0.9em;
            color: #a0a0a0;
            margin-bottom: 5px;
        }

        .resource-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #fff;
        }

        .resource-rate {
            font-size: 0.8em;
            color: #4ecca3;
            margin-top: 5px;
        }

        .click-button {
            width: 100%;
            padding: 30px;
            font-size: 1.8em;
            background: linear-gradient(135deg, #e94560 0%, #c23a51 100%);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
            margin-bottom: 20px;
        }

        .click-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.6);
        }

        .click-button:active {
            transform: translateY(2px);
            box-shadow: 0 3px 15px rgba(233, 69, 96, 0.4);
        }

        .evolution-stage {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .stage-name {
            font-size: 1.4em;
            color: #4ecca3;
            margin-bottom: 10px;
        }

        .stage-description {
            color: #a0a0a0;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #4ecca3);
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .upgrade-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .upgrade-item:hover {
            background: rgba(0, 0, 0, 0.5);
            transform: translateX(5px);
        }

        .upgrade-info {
            flex: 1;
        }

        .upgrade-name {
            font-weight: bold;
            color: #4ecca3;
            margin-bottom: 5px;
        }

        .upgrade-desc {
            font-size: 0.85em;
            color: #a0a0a0;
        }

        .upgrade-cost {
            font-weight: bold;
            color: #e94560;
            margin-left: 15px;
        }

        .buy-button {
            padding: 8px 20px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .buy-button:hover:not(:disabled) {
            background: #3db892;
            transform: scale(1.05);
        }

        .buy-button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        .log-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #4ecca3;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8em;
            color: #a0a0a0;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.2em;
            color: #fff;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .control-button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .floating-text {
            position: fixed;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.2em;
            color: #4ecca3;
            animation: floatUp 1s ease-out forwards;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        .combo-display {
            text-align: center;
            font-size: 1.5em;
            color: #ffd700;
            margin: 10px 0;
            min-height: 30px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #c23a51;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧬 进化点击游戏</h1>
            <p class="subtitle">从单细胞到宇宙主宰的进化之旅</p>
        </header>

        <div class="game-area">
            <div class="left-panel">
                <div class="panel">
                    <h2 class="panel-title">📊 资源</h2>
                    <div class="resource-display">
                        <div class="resource-item">
                            <div class="resource-name">DNA</div>
                            <div class="resource-value" id="dna-count">0</div>
                            <div class="resource-rate" id="dna-rate">+0/秒</div>
                        </div>
                        <div class="resource-item">
                            <div class="resource-name">能量</div>
                            <div class="resource-value" id="energy-count">100</div>
                            <div class="resource-rate" id="energy-rate">+0/秒</div>
                        </div>
                    </div>

                    <button class="click-button" id="click-btn">
                        🧫 收集 DNA
                    </button>

                    <div class="combo-display" id="combo-display"></div>

                    <div class="evolution-stage">
                        <div class="stage-name" id="stage-name">原始汤</div>
                        <div class="stage-description" id="stage-desc">
                            生命刚刚开始，简单的有机分子在水中漂浮
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="evolution-progress" style="width: 0%"></div>
                        </div>
                        <div style="text-align: center; color: #a0a0a0;">
                            下一阶段：<span id="next-stage">原核生物</span>
                            (<span id="dna-needed">100</span> DNA)
                        </div>
                    </div>
                </div>

                <div class="panel" style="margin-top: 20px;">
                    <h2 class="panel-title">📈 统计</h2>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-label">总点击次数</div>
                            <div class="stat-value" id="total-clicks">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">总 DNA 获得</div>
                            <div class="stat-value" id="total-dna">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">游戏时间</div>
                            <div class="stat-value" id="play-time">0:00</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">进化阶段</div>
                            <div class="stat-value" id="stage-num">1/15</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="panel">
                    <h2 class="panel-title">⬆️ 升级</h2>
                    <div class="upgrade-list" id="upgrade-list">
                        <!-- Upgrades will be inserted here -->
                    </div>
                </div>

                <div class="panel" style="margin-top: 20px;">
                    <h2 class="panel-title">📜 日志</h2>
                    <div class="log-container" id="log-container">
                        <div class="log-entry">欢迎来到进化点击游戏！</div>
                        <div class="log-entry">点击按钮开始收集 DNA</div>
                    </div>
                </div>

                <div class="panel" style="margin-top: 20px;">
                    <h2 class="panel-title">⚙️ 控制</h2>
                    <div class="controls">
                        <button class="control-button" onclick="game.saveGame()">💾 保存</button>
                        <button class="control-button" onclick="game.loadGame()">📂 加载</button>
                        <button class="control-button" onclick="game.resetGame()">🔄 重置</button>
                        <button class="control-button" onclick="game.exportSave()">📤 导出存档</button>
                        <button class="control-button" onclick="game.importSave()">📥 导入存档</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 游戏常量配置
        const EVOLUTION_STAGES = [
            { name: "原始汤", description: "生命刚刚开始，简单的有机分子在水中漂浮", dnaRequired: 0 },
            { name: "原核生物", description: "最简单的细胞形式，没有细胞核", dnaRequired: 100 },
            { name: "真核生物", description: "拥有细胞核的复杂细胞", dnaRequired: 500 },
            { name: "多细胞生物", description: "多个细胞协同工作", dnaRequired: 2000 },
            { name: "简单动物", description: "基础的运动和感知能力", dnaRequired: 10000 },
            { name: "鱼类", description: "水中游弋的脊椎动物", dnaRequired: 50000 },
            { name: "两栖动物", description: "可以在水和陆地生活", dnaRequired: 200000 },
            { name: "爬行动物", description: "完全适应陆地生活", dnaRequired: 1000000 },
            { name: "哺乳动物", description: "温血动物，哺育后代", dnaRequired: 5000000 },
            { name: "灵长类", description: "高智商，灵活的手指", dnaRequired: 25000000 },
            { name: "早期人类", description: "开始使用工具", dnaRequired: 100000000 },
            { name: "智人", description: "现代人类，文明诞生", dnaRequired: 500000000 },
            { name: "信息时代", description: "科技飞速发展", dnaRequired: 2000000000 },
            { name: "星际文明", description: "探索宇宙的奥秘", dnaRequired: 10000000000 },
            { name: "宇宙主宰", description: "掌控整个宇宙的力量", dnaRequired: 50000000000 }
        ];

        const UPGRADES = [
            {
                id: "better_absorption",
                name: "强化吸收",
                description: "每次点击获得更多 DNA (+1)",
                baseCost: 50,
                costMultiplier: 1.5,
                effect: "click",
                value: 1,
                maxLevel: 50
            },
            {
                id: "enzyme_boost",
                name: "酶催化",
                description: "提高 DNA 生成速度 (+0.5/秒)",
                baseCost: 100,
                costMultiplier: 1.4,
                effect: "passive",
                value: 0.5,
                maxLevel: 50
            },
            {
                id: "cell_division",
                name: "细胞分裂",
                description: "自动产生 DNA (+1/秒)",
                baseCost: 500,
                costMultiplier: 1.6,
                effect: "passive",
                value: 1,
                maxLevel: 30
            },
            {
                id: "mutation_rate",
                name: "突变率提升",
                description: "全局增益 +10%",
                baseCost: 1000,
                costMultiplier: 2.0,
                effect: "global",
                value: 0.1,
                maxLevel: 20
            },
            {
                id: "energy_efficiency",
                name: "能量效率",
                description: "减少能量消耗 (-10%)",
                baseCost: 750,
                costMultiplier: 1.8,
                effect: "efficiency",
                value: 0.1,
                maxLevel: 25
            }
        ];

        // 游戏主类
        class EvolutionGame {
            constructor() {
                this.dna = 0;
                this.energy = 100;
                this.maxEnergy = 100;
                this.totalClicks = 0;
                this.totalDnaEarned = 0;
                this.currentStage = 0;
                this.startTime = Date.now();
                this.upgradeLevels = {};
                this.passiveDps = 0;
                this.clickPower = 1;
                this.globalMultiplier = 1;
                this.combo = 0;
                this.lastClickTime = 0;
                
                // 初始化升级等级
                UPGRADES.forEach(upgrade => {
                    this.upgradeLevels[upgrade.id] = 0;
                });

                this.initUI();
                this.loadGame();
                this.startGameLoop();
            }

            initUI() {
                // 绑定点击事件
                document.getElementById('click-btn').addEventListener('click', (e) => {
                    this.handleClick(e);
                });

                // 渲染升级列表
                this.renderUpgrades();
            }

            handleClick(event) {
                const now = Date.now();
                
                // 连击系统
                if (now - this.lastClickTime < 500) {
                    this.combo++;
                } else {
                    this.combo = 1;
                }
                this.lastClickTime = now;

                // 计算获得的 DNA
                let dnaGained = this.clickPower * this.globalMultiplier;
                
                // 连击奖励
                if (this.combo > 1) {
                    dnaGained *= (1 + this.combo * 0.1);
                }

                // 暴击系统 (5% 概率)
                let isCrit = Math.random() < 0.05;
                if (isCrit) {
                    dnaGained *= 2;
                }

                dnaGained = Math.floor(dnaGained);
                
                this.dna += dnaGained;
                this.totalClicks++;
                this.totalDnaEarned += dnaGained;

                // 显示浮动文字
                this.showFloatingText(event.clientX, event.clientY, 
                    `+${dnaGained} DNA${isCrit ? ' (暴击!)' : ''}${this.combo > 1 ? ` (${this.combo}连击)` : ''}`);

                // 更新 UI
                this.updateUI();
                this.log(`点击获得 ${dnaGained} DNA${isCrit ? ' (暴击!)' : ''}`);

                // 检查进化
                this.checkEvolution();
            }

            showFloatingText(x, y, text) {
                const element = document.createElement('div');
                element.className = 'floating-text';
                element.textContent = text;
                element.style.left = x + 'px';
                element.style.top = y + 'px';
                document.body.appendChild(element);
                
                setTimeout(() => {
                    element.remove();
                }, 1000);
            }

            checkEvolution() {
                const nextStageIndex = this.currentStage + 1;
                if (nextStageIndex < EVOLUTION_STAGES.length) {
                    const nextStage = EVOLUTION_STAGES[nextStageIndex];
                    if (this.dna >= nextStage.dnaRequired) {
                        this.evolve(nextStageIndex);
                    }
                }
            }

            evolve(newStageIndex) {
                const oldStage = EVOLUTION_STAGES[this.currentStage];
                const newStage = EVOLUTION_STAGES[newStageIndex];
                
                this.currentStage = newStageIndex;
                this.globalMultiplier *= 1.5; // 进化奖励
                
                this.log(`🎉 进化成功！从 ${oldStage.name} 进化为 ${newStage.name}！`);
                this.log(`获得 50% 全局加成奖励！`);
                
                this.updateUI();
            }

            buyUpgrade(upgradeId) {
                const upgrade = UPGRADES.find(u => u.id === upgradeId);
                if (!upgrade) return;

                const currentLevel = this.upgradeLevels[upgradeId];
                if (currentLevel >= upgrade.maxLevel) return;

                const cost = Math.floor(upgrade.baseCost * Math.pow(upgrade.costMultiplier, currentLevel));
                
                if (this.dna >= cost) {
                    this.dna -= cost;
                    this.upgradeLevels[upgradeId]++;
                    
                    // 应用升级效果
                    this.applyUpgrade(upgrade);
                    
                    this.log(`购买了 ${upgrade.name} (等级 ${this.upgradeLevels[upgradeId]})`);
                    this.renderUpgrades();
                    this.updateUI();
                }
            }

            applyUpgrade(upgrade) {
                switch (upgrade.effect) {
                    case 'click':
                        this.clickPower += upgrade.value;
                        break;
                    case 'passive':
                        this.passiveDps += upgrade.value;
                        break;
                    case 'global':
                        this.globalMultiplier += upgrade.value;
                        break;
                    case 'efficiency':
                        // 能量效率逻辑可以在这里扩展
                        break;
                }
            }

            renderUpgrades() {
                const container = document.getElementById('upgrade-list');
                container.innerHTML = '';

                UPGRADES.forEach(upgrade => {
                    const currentLevel = this.upgradeLevels[upgrade.id];
                    const cost = Math.floor(upgrade.baseCost * Math.pow(upgrade.costMultiplier, currentLevel));
                    const canAfford = this.dna >= cost;
                    const isMaxLevel = currentLevel >= upgrade.maxLevel;

                    const item = document.createElement('div');
                    item.className = 'upgrade-item';
                    item.innerHTML = `
                        <div class="upgrade-info">
                            <div class="upgrade-name">${upgrade.name} (Lv.${currentLevel}/${upgrade.maxLevel})</div>
                            <div class="upgrade-desc">${upgrade.description}</div>
                        </div>
                        <div class="upgrade-cost">${isMaxLevel ? 'MAX' : cost + ' DNA'}</div>
                        <button class="buy-button" 
                                onclick="game.buyUpgrade('${upgrade.id}')" 
                                ${!canAfford || isMaxLevel ? 'disabled' : ''}>
                            ${isMaxLevel ? '已满级' : '购买'}
                        </button>
                    `;
                    container.appendChild(item);
                });
            }

            updateUI() {
                // 更新资源显示
                document.getElementById('dna-count').textContent = this.formatNumber(this.dna);
                document.getElementById('energy-count').textContent = this.formatNumber(Math.floor(this.energy));
                document.getElementById('dna-rate').textContent = `+${this.formatNumber(this.passiveDps)}/秒`;
                document.getElementById('energy-rate').textContent = `+${this.formatNumber(this.maxEnergy * 0.1)}/秒`;

                // 更新进化阶段
                const currentStageData = EVOLUTION_STAGES[this.currentStage];
                document.getElementById('stage-name').textContent = currentStageData.name;
                document.getElementById('stage-desc').textContent = currentStageData.description;

                // 计算进度
                let progress = 0;
                let dnaNeeded = 0;
                let nextStageName = 'MAX';
                
                if (this.currentStage < EVOLUTION_STAGES.length - 1) {
                    const nextStage = EVOLUTION_STAGES[this.currentStage + 1];
                    const prevStageDna = this.currentStage > 0 ? EVOLUTION_STAGES[this.currentStage].dnaRequired : 0;
                    const dnaInRange = this.dna - prevStageDna;
                    const dnaToNext = nextStage.dnaRequired - prevStageDna;
                    progress = (dnaInRange / dnaToNext) * 100;
                    dnaNeeded = nextStage.dnaRequired;
                    nextStageName = nextStage.name;
                } else {
                    progress = 100;
                }

                document.getElementById('evolution-progress').style.width = Math.min(progress, 100) + '%';
                document.getElementById('next-stage').textContent = nextStageName;
                document.getElementById('dna-needed').textContent = this.formatNumber(dnaNeeded);
                document.getElementById('stage-num').textContent = `${this.currentStage + 1}/${EVOLUTION_STAGES.length}`;

                // 更新统计
                document.getElementById('total-clicks').textContent = this.formatNumber(this.totalClicks);
                document.getElementById('total-dna').textContent = this.formatNumber(this.totalDnaEarned);
                
                const playTimeSeconds = Math.floor((Date.now() - this.startTime) / 1000);
                const minutes = Math.floor(playTimeSeconds / 60);
                const seconds = playTimeSeconds % 60;
                document.getElementById('play-time').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

                // 更新连击显示
                const comboDisplay = document.getElementById('combo-display');
                if (this.combo > 1) {
                    comboDisplay.textContent = `🔥 ${this.combo} 连击! +${Math.round((1 + this.combo * 0.1) * 100 - 100)}% 加成`;
                } else {
                    comboDisplay.textContent = '';
                }

                // 更新升级按钮状态
                this.renderUpgrades();
            }

            formatNumber(num) {
                if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
                if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
                if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
                if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
                return Math.floor(num).toString();
            }

            log(message) {
                const container = document.getElementById('log-container');
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                container.insertBefore(entry, container.firstChild);

                // 限制日志数量
                while (container.children.length > 50) {
                    container.removeChild(container.lastChild);
                }
            }

            startGameLoop() {
                setInterval(() => {
                    // 被动 DNA 生成
                    if (this.passiveDps > 0) {
                        const dnaPerTick = this.passiveDps / 10; // 每 0.1 秒
                        this.dna += dnaPerTick;
                        this.totalDnaEarned += dnaPerTick;
                    }

                    // 能量再生
                    if (this.energy < this.maxEnergy) {
                        this.energy = Math.min(this.maxEnergy, this.energy + this.maxEnergy * 0.01);
                    }

                    // 检查进化
                    this.checkEvolution();

                    // 更新 UI
                    this.updateUI();
                }, 100); // 每 0.1 秒更新一次
            }

            saveGame() {
                const saveData = {
                    dna: this.dna,
                    energy: this.energy,
                    totalClicks: this.totalClicks,
                    totalDnaEarned: this.totalDnaEarned,
                    currentStage: this.currentStage,
                    startTime: this.startTime,
                    upgradeLevels: this.upgradeLevels,
                    passiveDps: this.passiveDps,
                    clickPower: this.clickPower,
                    globalMultiplier: this.globalMultiplier,
                    version: '1.0'
                };
                
                localStorage.setItem('evolutionGameSave', JSON.stringify(saveData));
                this.log('游戏已保存');
            }

            loadGame() {
                const saveData = localStorage.getItem('evolutionGameSave');
                if (saveData) {
                    try {
                        const data = JSON.parse(saveData);
                        this.dna = data.dna || 0;
                        this.energy = data.energy || 100;
                        this.totalClicks = data.totalClicks || 0;
                        this.totalDnaEarned = data.totalDnaEarned || 0;
                        this.currentStage = data.currentStage || 0;
                        this.startTime = data.startTime || Date.now();
                        this.upgradeLevels = data.upgradeLevels || {};
                        this.passiveDps = data.passiveDps || 0;
                        this.clickPower = data.clickPower || 1;
                        this.globalMultiplier = data.globalMultiplier || 1;
                        
                        // 重新计算被动 DPS
                        this.recalculatePassiveDps();
                        
                        this.log('游戏已加载');
                        this.updateUI();
                        this.renderUpgrades();
                    } catch (e) {
                        this.log('读取存档失败，开始新游戏');
                    }
                }
            }

            recalculatePassiveDps() {
                this.passiveDps = 0;
                UPGRADES.forEach(upgrade => {
                    if (upgrade.effect === 'passive') {
                        const level = this.upgradeLevels[upgrade.id] || 0;
                        this.passiveDps += upgrade.value * level;
                    }
                });
            }

            resetGame() {
                if (confirm('确定要重置游戏吗？所有进度将丢失！')) {
                    localStorage.removeItem('evolutionGameSave');
                    location.reload();
                }
            }

            exportSave() {
                const saveData = localStorage.getItem('evolutionGameSave');
                if (saveData) {
                    const blob = new Blob([saveData], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'evolution_save.json';
                    a.click();
                    URL.revokeObjectURL(url);
                    this.log('存档已导出');
                } else {
                    this.log('没有可导出的存档');
                }
            }

            importSave() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            try {
                                const data = JSON.parse(event.target.result);
                                localStorage.setItem('evolutionGameSave', JSON.stringify(data));
                                this.loadGame();
                                this.log('存档已导入');
                            } catch (err) {
                                this.log('导入存档失败：文件格式错误');
                            }
                        };
                        reader.readAsText(file);
                    }
                };
                input.click();
            }
        }

        // 启动游戏
        let game;
        window.addEventListener('DOMContentLoaded', () => {
            game = new EvolutionGame();
            
            // 自动保存
            setInterval(() => {
                game.saveGame();
            }, 30000); // 每 30 秒自动保存
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
                e.preventDefault();
                const btn = document.getElementById('click-btn');
                btn.click();
                
                // 模拟点击效果
                const rect = btn.getBoundingClientRect();
                const event = new MouseEvent('click', {
                    clientX: rect.left + rect.width / 2,
                    clientY: rect.top + rect.height / 2
                });
                game.handleClick(event);
            }
        });
    </script>
</body>
</html>
