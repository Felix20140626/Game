<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命进化 - 文字点击游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4ecca3;
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .game-area {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .creature-display {
            text-align: center;
            padding: 30px;
        }

        .creature-stage {
            font-size: 2em;
            margin-bottom: 15px;
        }

        .creature-name {
            font-size: 1.8em;
            color: #4ecca3;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .creature-desc {
            font-size: 1.1em;
            line-height: 1.6;
            color: #ccc;
            min-height: 80px;
        }

        .stats {
            margin-top: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .energy-display {
            font-size: 2.5em;
            text-align: center;
            color: #ffd700;
            margin: 20px 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .click-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.5em;
            background: linear-gradient(135deg, #4ecca3 0%, #38a169 100%);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .click-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(78, 204, 163, 0.4);
        }

        .click-btn:active {
            transform: translateY(0);
        }

        .evolve-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .evolve-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.4);
        }

        .evolve-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .upgrade-btn {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .upgrade-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(245, 87, 108, 0.4);
        }

        .upgrade-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .log-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #4ecca3;
            padding-left: 10px;
        }

        .log-entry.evolution {
            border-left-color: #667eea;
            color: #a5b4fc;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecca3, #38a169);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: bold;
        }

        .section-title {
            font-size: 1.3em;
            color: #4ecca3;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(78, 204, 163, 0.3);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 生命进化 🧬</h1>
        
        <div class="game-area">
            <div class="panel">
                <div class="creature-display">
                    <div class="creature-stage" id="stageIcon">🦠</div>
                    <div class="creature-name" id="creatureName">原始单细胞</div>
                    <div class="creature-desc" id="creatureDesc">
                        最原始的生命形式，在远古海洋中漂浮，通过吸收周围营养物质生存。
                    </div>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <span>进化阶段:</span>
                        <span id="currentStage">1 / 10</span>
                    </div>
                    <div class="stat-item">
                        <span>每次点击:</span>
                        <span id="clickPower">+1 能量</span>
                    </div>
                    <div class="stat-item">
                        <span>自动生产:</span>
                        <span id="autoProduction">0 能量/秒</span>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h3 class="section-title">能量收集</h3>
                <div class="energy-display">
                    ⚡ <span id="energy">0</span>
                </div>
                
                <button class="click-btn" id="clickBtn" onclick="collectEnergy()">
                    吸收能量
                </button>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="evolutionProgress" style="width: 0%">
                        0%
                    </div>
                </div>
                
                <button class="evolve-btn" id="evolveBtn" onclick="evolve()" disabled>
                    进化 (需要 <span id="evolveCost">10</span> 能量)
                </button>
            </div>
        </div>
        
        <div class="game-area">
            <div class="panel">
                <h3 class="section-title">升级</h3>
                <button class="upgrade-btn" id="upgradeClick" onclick="upgradeClickPower()">
                    强化吸收能力 (+1 点击) - <span id="clickUpgradeCost">5</span> 能量
                </button>
                <button class="upgrade-btn" id="upgradeAuto" onclick="upgradeAutoProduction()">
                    培养共生菌 (+1/秒) - <span id="autoUpgradeCost">20</span> 能量
                </button>
            </div>
            
            <div class="panel">
                <h3 class="section-title">进化日志</h3>
                <div class="log-area" id="gameLog">
                    <div class="log-entry">游戏开始！生命诞生了...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 游戏状态
        let gameState = {
            energy: 0,
            stage: 0,
            clickPower: 1,
            autoProduction: 0,
            clickUpgradeCost: 5,
            autoUpgradeCost: 20
        };

        // 进化阶段数据
        const evolutionStages = [
            {
                name: "原始单细胞",
                icon: "🦠",
                description: "最原始的生命形式，在远古海洋中漂浮，通过吸收周围营养物质生存。",
                evolveCost: 10
            },
            {
                name: "真核细胞",
                icon: "🔬",
                description: "拥有了细胞核和细胞器，结构更加复杂，能够进行更高效的能量转换。",
                evolveCost: 50
            },
            {
                name: "多细胞生物",
                icon: "🌿",
                description: "多个细胞协同工作，形成了简单的组织结构，生命开始展现多样性。",
                evolveCost: 150
            },
            {
                name: "海洋蠕虫",
                icon: "🪱",
                description: "在海底游动的简单生物，拥有基本的神经系统和运动能力。",
                evolveCost: 400
            },
            {
                name: "原始鱼类",
                icon: "🐟",
                description: "第一批脊椎动物，拥有骨骼和更发达的感官系统，在海洋中自由穿梭。",
                evolveCost: 1000
            },
            {
                name: "两栖动物",
                icon: "🐸",
                description: "勇敢地从海洋走向陆地，既能在水中生活也能在陆地上活动。",
                evolveCost: 2500
            },
            {
                name: "爬行动物",
                icon: "🦎",
                description: "完全适应陆地生活，产下羊膜卵，成为真正的陆生脊椎动物。",
                evolveCost: 6000
            },
            {
                name: "哺乳动物",
                icon: "🐾",
                description: "恒温动物，拥有毛发和乳腺，能够照顾后代，智力开始发展。",
                evolveCost: 15000
            },
            {
                name: "灵长类",
                icon: "🐒",
                description: "拥有灵活的双手和发达的大脑，能够使用工具，社会性增强。",
                evolveCost: 40000
            },
            {
                name: "智慧人类",
                icon: "🧑‍🔬",
                description: "拥有高度发达的智慧和文明，能够探索宇宙奥秘，创造辉煌文化。",
                evolveCost: 100000
            }
        ];

        // 初始化游戏
        function initGame() {
            updateDisplay();
            // 启动自动生产
            setInterval(() => {
                if (gameState.autoProduction > 0) {
                    addEnergy(gameState.autoProduction);
                }
            }, 1000);
        }

        // 添加能量
        function addEnergy(amount) {
            gameState.energy += amount;
            updateDisplay();
        }

        // 收集能量（点击）
        function collectEnergy() {
            addEnergy(gameState.clickPower);
            
            // 添加点击动画效果
            const btn = document.getElementById('clickBtn');
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
            }, 100);
        }

        // 进化
        function evolve() {
            const currentStageData = evolutionStages[gameState.stage];
            if (gameState.energy >= currentStageData.evolveCost && gameState.stage < evolutionStages.length - 1) {
                gameState.energy -= currentStageData.evolveCost;
                gameState.stage++;
                
                const newStageData = evolutionStages[gameState.stage];
                addLog(`进化成功！现在你是 ${newStageData.name}！`, true);
                
                updateDisplay();
            }
        }

        // 升级点击能力
        function upgradeClickPower() {
            if (gameState.energy >= gameState.clickUpgradeCost) {
                gameState.energy -= gameState.clickUpgradeCost;
                gameState.clickPower += 1;
                gameState.clickUpgradeCost = Math.floor(gameState.clickUpgradeCost * 1.5);
                addLog("强化了能量吸收能力！每次点击获得更多能量。");
                updateDisplay();
            }
        }

        // 升级自动生产
        function upgradeAutoProduction() {
            if (gameState.energy >= gameState.autoUpgradeCost) {
                gameState.energy -= gameState.autoUpgradeCost;
                gameState.autoProduction += 1;
                gameState.autoUpgradeCost = Math.floor(gameState.autoUpgradeCost * 1.4);
                addLog("培养了共生菌！现在开始自动产生能量。");
                updateDisplay();
            }
        }

        // 添加日志
        function addLog(message, isEvolution = false) {
            const logArea = document.getElementById('gameLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry' + (isEvolution ? ' evolution' : '');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logArea.insertBefore(entry, logArea.firstChild);
            
            // 限制日志数量
            while (logArea.children.length > 50) {
                logArea.removeChild(logArea.lastChild);
            }
        }

        // 更新显示
        function updateDisplay() {
            const currentStageData = evolutionStages[gameState.stage];
            const nextStageData = gameState.stage < evolutionStages.length - 1 
                ? evolutionStages[gameState.stage + 1] 
                : null;

            // 更新生物信息
            document.getElementById('stageIcon').textContent = currentStageData.icon;
            document.getElementById('creatureName').textContent = currentStageData.name;
            document.getElementById('creatureDesc').textContent = currentStageData.description;
            
            // 更新统计
            document.getElementById('currentStage').textContent = `${gameState.stage + 1} / ${evolutionStages.length}`;
            document.getElementById('clickPower').textContent = `+${gameState.clickPower} 能量`;
            document.getElementById('autoProduction').textContent = `${gameState.autoProduction} 能量/秒`;
            
            // 更新能量
            document.getElementById('energy').textContent = gameState.energy.toLocaleString();
            
            // 更新进化进度
            if (nextStageData) {
                const progress = Math.min(100, (gameState.energy / nextStageData.evolveCost) * 100);
                document.getElementById('evolutionProgress').style.width = `${progress}%`;
                document.getElementById('evolutionProgress').textContent = `${Math.floor(progress)}%`;
                document.getElementById('evolveCost').textContent = nextStageData.evolveCost.toLocaleString();
                
                // 更新进化按钮
                const evolveBtn = document.getElementById('evolveBtn');
                evolveBtn.disabled = gameState.energy < nextStageData.evolveCost;
                evolveBtn.innerHTML = `进化到 ${nextStageData.name} (需要 ${nextStageData.evolveCost.toLocaleString()} 能量)`;
            } else {
                document.getElementById('evolutionProgress').style.width = '100%';
                document.getElementById('evolutionProgress').textContent = 'MAX';
                document.getElementById('evolveBtn').disabled = true;
                document.getElementById('evolveBtn').innerHTML = '已达到最高进化阶段！';
            }
            
            // 更新升级按钮
            document.getElementById('clickUpgradeCost').textContent = gameState.clickUpgradeCost.toLocaleString();
            document.getElementById('autoUpgradeCost').textContent = gameState.autoUpgradeCost.toLocaleString();
            
            document.getElementById('upgradeClick').disabled = gameState.energy < gameState.clickUpgradeCost;
            document.getElementById('upgradeAuto').disabled = gameState.energy < gameState.autoUpgradeCost;
        }

        // 启动游戏
        initGame();
    </script>
</body>
</html>
